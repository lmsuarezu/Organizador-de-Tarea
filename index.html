<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Organizador de Tareas</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
    --bg: #0f1115;
    --panel: #171a21;
    --task: #1f2430;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #7f8cff;
}

.light {
    --bg: #f4f4f4;
    --panel: #ffffff;
    --task: #f1f3f4;
    --text: #111;
    --muted: #555;
    --accent: #5c6cff;
}

body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    transition: all .3s;
}

h1 { text-align: center; }

.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

button {
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: var(--accent);
    color: #fff;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    background: var(--task);
    color: var(--text);
    border: none;
    border-radius: 8px;
}

.panel, .form-panel, .filter-panel {
    background: var(--panel);
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.task {
    background: var(--task);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.alta { border-left: 4px solid #ff6b6b; }
.media { border-left: 4px solid #feca57; }
.baja { border-left: 4px solid #1dd1a1; }

#focusPanel {
    display: none;
    background: var(--panel);
    padding: 20px;
    border-radius: 14px;
    margin-top: 20px;
}

@media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
}

/* 📱 MEJORA MÓVIL */
@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .top-bar {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
    }

    .top-bar button {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
    }

    .form-panel input,
    .form-panel select,
    .form-panel button {
        padding: 14px;
        font-size: 1rem;
    }

    .filter-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .filter-panel button {
        padding: 14px;
        font-size: 0.95rem;
    }

    .container {
        grid-template-columns: 1fr;
    }

    .panel h2 {
        font-size: 1.1rem;
    }

    .task {
        padding: 14px;
        font-size: 0.95rem;
    }

    .task button {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        font-size: 0.9rem;
    }

    #focusPanel {
        position: fixed;
        inset: 0;
        z-index: 999;
        margin: 0;
        border-radius: 0;
        overflow-y: auto;
    }

    #focusPanel button {
        width: 100%;
        padding: 16px;
        font-size: 1rem;
    }
}

</style>
</head>

<body>

<h1>📝 Organizador de Tareas</h1>

<div class="top-bar">
    <div>⌨️ Atajos activos</div>
    <button onclick="toggleTheme()">🌗 Claro / Oscuro</button>
</div>

<div class="form-panel">
    <input id="title" placeholder="Nueva tarea (N)">
    <select id="importance">
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
    </select>
    <select id="urgency">
        <option value="urgente">Urgente</option>
        <option value="no">No urgente</option>
    </select>
    <input type="date" id="deadline">
    <button onclick="addTask()">Añadir (Enter)</button>
</div>

<div class="filter-panel">
    <button onclick="setFilter('all')">1 Todas</button>
    <button onclick="setFilter('urgent')">2 Urgentes</button>
    <button onclick="setFilter('high')">3 Alta</button>
    <button onclick="setFilter('pending')">4 Pendientes</button>
    <button onclick="startFocus()">🎯 Enfoque (F)</button>
</div>

<div class="container">
    <div class="panel">
        <h2>🕒 Pendientes</h2>
        <div id="pending"></div>
    </div>
    <div class="panel">
        <h2>✅ Hechas</h2>
        <div id="completed"></div>
    </div>
</div>

<div id="focusPanel">
    <h2>Modo enfoque</h2>
    <div id="focusTask"></div>
    <button onclick="stopFocus()">Salir (Esc)</button>
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBQQWnsn-zFjvryHRwjClr8sZIk0V1sb-C",
  authDomain: "organizadortareas-eb010.firebaseapp.com",
  projectId: "organizadortareas-eb010",
  storageBucket: "organizadortareas-eb010.firebasestorage.app",
  messagingSenderId: "181036478852",
  appId: "1:181036478852:web:c8cddf99c141a11a3b6dd1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script>
let tasks = [];
let filter = "all";

/* ☁️ CARGAR EN TIEMPO REAL */
db.collection("tasks").onSnapshot(snapshot => {
    tasks = [];
    snapshot.forEach(doc => tasks.push(doc.data()));
    render();
});

/* 🌗 TEMA */
function toggleTheme() {
    document.body.classList.toggle("light");
}

/* 🧠 TAREAS */
function addTask() {
    if (!title.value) return;
    const task = {
        id: Date.now(),
        title: title.value,
        importance: importance.value,
        urgency: urgency.value,
        deadline: deadline.value,
        done: false
    };
    db.collection("tasks").doc(task.id.toString()).set(task);
    title.value = "";
}

function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    db.collection("tasks").doc(id.toString()).set({...t, done: !t.done});
}

function deleteTask(id) {
    db.collection("tasks").doc(id.toString()).delete();
}

function setFilter(f) {
    filter = f;
    render();
}

function startFocus() {
    const t = tasks.find(t => !t.done);
    if (!t) return;
    focusPanel.style.display = "block";
    focusTask.innerHTML = `
        <div class="task ${t.importance}">
            <h3>${t.title}</h3>
            <button onclick="toggleTask(${t.id})">Hecha</button>
        </div>`;
}

function stopFocus() {
    focusPanel.style.display = "none";
    render();
}

function render() {
    pending.innerHTML = "";
    completed.innerHTML = "";

    tasks.filter(t => {
        if (filter === "urgent") return t.urgency === "urgente";
        if (filter === "high") return t.importance === "alta";
        if (filter === "pending") return !t.done;
        return true;
    }).forEach(t => {
        const div = document.createElement("div");
        div.className = `task ${t.importance}`;
        div.innerHTML = `
            <strong>${t.title}</strong><br>
            <button onclick="toggleTask(${t.id})">${t.done ? "Deshacer" : "Hecha"}</button>
            <button onclick="deleteTask(${t.id})">Eliminar</button>
        `;
        t.done ? completed.appendChild(div) : pending.appendChild(div);
    });
}

/* ⌨️ ATAJOS */
document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "n") title.focus();
    if (e.key === "Enter") addTask();
    if (e.key === "f") startFocus();
    if (e.key === "Escape") stopFocus();
    if (e.key === "1") setFilter("all");
    if (e.key === "2") setFilter("urgent");
    if (e.key === "3") setFilter("high");
    if (e.key === "4") setFilter("pending");
    if (e.key === "d") toggleTheme();
});
</script>

</body>
</html>
