<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">

<style>
:root{
  --bg:#0d0f14;
  --surface:#13161d;
  --card:#1a1f28;
  --border:#2a2f3d;
  --text:#e8eaf0;
  --muted:#8b93a7;
  --accent:#7c8cff;
  --red:#f87171;
  --amber:#fbbf24;
  --green:#34d399;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100vh;
}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:20px;
  overflow:auto;
}

.logo{
  font-size:22px;
  font-weight:700;
  margin-bottom:20px;
}

.project{
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:8px;
  color:var(--muted);
  transition:.2s;
}

.project:hover,
.project.active{
  background:var(--card);
  color:var(--text);
}

.main{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  height:70px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(0,0,0,.15);
}

.header-actions{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.content{
  flex:1;
  overflow:auto;
  padding:20px;
}

.form{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:20px;
}

input,select{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px;
  border-radius:12px;
}

button.add{
  background:var(--accent);
  border:none;
  color:white;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
}

.board{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.column{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}

.column h2{
  margin-bottom:16px;
}

.task{
  background:var(--card);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  border-left:4px solid var(--accent);
}

.task.high{border-color:var(--red)}
.task.medium{border-color:var(--amber)}
.task.low{border-color:var(--green)}

.task-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.task-title{
  font-size:14px;
  font-weight:600;
}

.task-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

.task-actions{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.small-btn{
  flex:1;
  border:none;
  border-radius:10px;
  padding:8px;
  background:#232938;
  color:var(--text);
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:min(1200px,95vw);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
}

.gantt-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.gantt-wrap{
  overflow-x:auto;
}

.gantt-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  min-width:700px;
}

.gantt-label{
  width:180px;
  flex-shrink:0;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gantt-track{
  flex:1;
  height:16px;
  position:relative;
  background:rgba(255,255,255,.04);
  border-radius:999px;
  overflow:hidden;
}

.gantt-bar{
  position:absolute;
  top:0;
  height:100%;
  border-radius:999px;
  display:flex;
  align-items:center;
  padding:0 8px;
  font-size:9px;
  font-weight:700;
  color:white;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}

.today-line{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:var(--accent);
  z-index:5;
}

@media(max-width:800px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .board{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .header{
    padding:0 12px;
  }

  .gantt-row{
    min-width:900px;
  }
}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">⚡ TaskFlow</div>

    <div class="project active" onclick="filterProject(null)">
      Resumen general
    </div>

    <div id="projects"></div>
  </aside>

  <main class="main">

    <header class="header">
      <h1>Organizador</h1>

      <div class="header-actions">

        <button class="icon-btn" onclick="toggleTheme()">🌙</button>

        <button class="icon-btn" onclick="showGantt()" title="Timeline">
          📊
        </button>

      </div>
    </header>

    <section class="content">

      <div class="form">
        <input id="title" placeholder="Nueva tarea">

        <select id="priority">
          <option value="high">Alta</option>
          <option value="medium">Media</option>
          <option value="low">Baja</option>
        </select>

        <input type="date" id="startDate">
        <input type="date" id="deadline">

        <button class="add" onclick="addTask()">Añadir</button>
      </div>

      <div class="board">

        <div class="column">
          <h2>🕒 Pendientes</h2>
          <div id="pending"></div>
        </div>

        <div class="column">
          <h2>✅ Completadas</h2>
          <div id="done"></div>
        </div>

      </div>

    </section>

  </main>

</div>

<div class="modal" id="ganttModal">
  <div class="modal-content">

    <div class="gantt-header">
      <h2>Timeline</h2>

      <select id="ganttProjectFilter" onchange="renderGantt()">
        <option value="">Resumen general</option>
      </select>
    </div>

    <div id="ganttContent"></div>

  </div>
</div>

<script>

let tasks = [];
let projects = [
  {id:1,name:'Trabajo'},
  {id:2,name:'Personal'}
];

let currentProject = null;

function save(){
  localStorage.setItem('tasks',JSON.stringify(tasks));
}

function load(){
  tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  render();
  renderProjects();
}

function addTask(){

  if(!title.value) return;

  tasks.push({
    id:Date.now(),
    title:title.value,
    priority:priority.value,
    startDate:startDate.value,
    deadline:deadline.value,
    done:false,
    project:1
  });

  title.value='';

  save();
  render();
}

function toggleTask(id){

  tasks = tasks.map(t =>
    t.id===id
      ? {...t,done:!t.done}
      : t
  );

  save();
  render();
}

function deleteTask(id){

  tasks = tasks.filter(t => t.id!==id);

  save();
  render();
}

function render(){

  pending.innerHTML='';
  done.innerHTML='';

  tasks
    .filter(t => currentProject===null || t.project===currentProject)
    .forEach(t => {

      const div = document.createElement('div');

      div.className = `task ${t.priority}`;

      div.innerHTML = `
        <div class="task-top">
          <div>
            <div class="task-title">${t.title}</div>
            <div class="task-meta">
              ${t.startDate || '-'} → ${t.deadline || '-'}
            </div>
          </div>
        </div>

        <div class="task-actions">
          <button class="small-btn" onclick="toggleTask(${t.id})">
            ${t.done ? 'Deshacer' : 'Hecha'}
          </button>

          <button class="small-btn" onclick="deleteTask(${t.id})">
            Eliminar
          </button>
        </div>
      `;

      t.done
        ? done.appendChild(div)
        : pending.appendChild(div);
    });
}

function renderProjects(){

  projectsEl = document.getElementById('projects');

  projectsEl.innerHTML = projects.map(p => `
    <div class="project" onclick="filterProject(${p.id})">
      ${p.name}
    </div>
  `).join('');

  ganttProjectFilter.innerHTML =
    `<option value="">Resumen general</option>`+
    projects.map(p =>
      `<option value="${p.id}">${p.name}</option>`
    ).join('');
}

function filterProject(id){
  currentProject=id;
  render();
}

function toggleTheme(){
  document.body.classList.toggle('light');
}

function showGantt(){

  renderGantt();

  ganttModal.classList.add('show');
}

window.onclick = e => {
  if(e.target===ganttModal){
    ganttModal.classList.remove('show');
  }
}

function renderGantt(){

  let filtered = tasks.filter(t =>
    t.startDate &&
    t.deadline
  );

  const filter = ganttProjectFilter.value;

  if(filter){
    filtered = filtered.filter(t => t.project == filter);
  }

  if(!filtered.length){
    ganttContent.innerHTML='No hay tareas';
    return;
  }

  const dates = filtered.flatMap(t => [
    new Date(t.startDate),
    new Date(t.deadline)
  ]);

  const minD = new Date(Math.min(...dates));
  const maxD = new Date(Math.max(...dates));

  const totalDays =
    Math.round((maxD-minD)/(1000*60*60*24))+1;

  const DAY_W = 22;

  const COLORS = {
    high:'#f87171',
    medium:'#fbbf24',
    low:'#34d399'
  };

  const today = new Date();
  today.setHours(0,0,0,0);

  const todayOffset =
    Math.round((today-minD)/(1000*60*60*24));

  const rows = filtered.map(t => {

    const s = new Date(t.startDate);
    const e = new Date(t.deadline);

    const startOff =
      Math.round((s-minD)/(1000*60*60*24));

    const dur =
      Math.round((e-s)/(1000*60*60*24))+1;

    const proj = projects.find(p => p.id===t.project);

    return `
      <div class="gantt-row">

        <div class="gantt-label">
          ${proj ? '📁 '+proj.name+' · ' : ''}
          ${t.title}
        </div>

        <div class="gantt-track">

          <div
            class="today-line"
            style="left:${todayOffset * DAY_W}px"
          ></div>

          <div
            class="gantt-bar"
            style="
              left:${startOff * DAY_W}px;
              width:${dur * DAY_W}px;
              background:${COLORS[t.priority]};
            "
          >
            ${t.title}
          </div>

        </div>

      </div>
    `;

  }).join('');

  ganttContent.innerHTML = `
    <div class="gantt-wrap">
      ${rows}
    </div>
  `;
}

load();

</script>

</body>
</html>
